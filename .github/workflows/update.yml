name: update

# 每个交易日收盘后自动取数、重算触发、写回 data/。
# 公开仓库的 Actions 不计费，无需任何 secret。
# 也可在仓库 Actions 页手动 Run workflow（对应管理面板的「立即运行」）。

on:
  schedule:
    # cron 用 UTC。北京时间 = UTC + 8。
    - cron: "40 7 * * 1-5"    # 北京 15:40（收盘后）
    - cron: "0 11 * * 1-5"    # 北京 19:00（晚间补一次，防上游延迟）
  # 改了配置或核心逻辑后立即重算，不用等下一次定时。
  # 只匹配这两个文件，因此本工作流自己提交 data/ 时不会被再次触发，不会循环。
  push:
    paths:
      - config.json
      - core.py
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个，避免并发推送冲突
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉全历史，push 前 rebase 才稳
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run core.py
        run: python3 core.py

      - name: Commit data/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "data/ 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 更新行情与触发快照 $(date -u +%Y-%m-%dT%H:%MZ)"
          # main 可能在本次运行期间被其他提交推进，直接 push 会被拒（non-fast-forward）。
          # push 前先 rebase，并重试几次，避免因竞态导致整次运行失败。
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "已推送（第 $i 次尝试）"; ok=1; break
            fi
            echo "push 失败，5 秒后重试…"; sleep 5
          done
          if [ "$ok" != "1" ]; then echo "push 连续失败，放弃"; exit 1; fi
